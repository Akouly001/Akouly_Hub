<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration & Back-Office — Akouly Boutique</title>
    <link rel="icon" type="image/png" href="images/logo-monogram-1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- SDK EmailJS pour envoi d'OTP par email -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>








        :root {
            --adm-bg: #090d16;
            --adm-card: #111827;
            --adm-surface: #1e293b;
            --adm-border: rgba(255, 255, 255, 0.08);
            --adm-text: #f8fafc;
            --adm-text-muted: #94a3b8;
            --adm-primary: #10b981;
            --adm-gold: #eab308;
            --adm-cyan: #06b6d4;
            --adm-danger: #ef4444;
        }

        [data-theme="light"] {
            --adm-bg: #f1f5f9;
            --adm-card: #ffffff;
            --adm-surface: #f8fafc;
            --adm-border: rgba(0, 0, 0, 0.08);
            --adm-text: #0f172a;
            --adm-text-muted: #64748b;
        }

        body {
            background-color: var(--adm-bg);
            color: var(--adm-text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Top Bar */
        .adm-header {
            background: var(--adm-card);
            border-bottom: 1px solid var(--adm-border);
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .adm-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--adm-text);
            text-decoration: none;
        }

        .adm-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--adm-primary);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .adm-nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Container */
        .adm-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        /* Auth Screen (2FA OTP) */
        .auth-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 1.5rem 1rem;
        }

        .auth-box {
            background: var(--adm-card);
            border: 1px solid var(--adm-border);
            border-radius: 18px;
            padding: 2.4rem 2rem;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.5);
            position: relative;
        }

        .auth-step {
            animation: authFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-icon-circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.12);
            border: 2px solid var(--adm-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--adm-primary);
            margin: 0 auto 1.2rem;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .auth-icon-circle.otp-mode {
            background: rgba(234, 179, 8, 0.12);
            border-color: var(--adm-gold);
            color: var(--adm-gold);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.25);
        }

        .auth-box input[type="password"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            background: var(--adm-surface);
            border: 1px solid var(--adm-border);
            color: var(--adm-text);
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 2px;
            margin: 1.2rem 0;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .auth-box input[type="password"]:focus {
            border-color: var(--adm-primary);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
        }

        /* 6-digit OTP Inputs Grid */
        .otp-inputs-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin: 1.5rem 0 1.2rem;
        }

        .otp-digit {
            width: 100%;
            height: 52px;
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            border-radius: 10px;
            background: var(--adm-surface);
            border: 2px solid var(--adm-border);
            color: var(--adm-gold);
            font-family: 'Fira Code', monospace;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
            padding: 0;
        }

        .otp-digit:focus {
            border-color: var(--adm-gold);
            box-shadow: 0 0 14px rgba(234, 179, 8, 0.35);
            background: rgba(234, 179, 8, 0.06);
            transform: translateY(-2px);
        }

        .otp-subtext {
            font-size: 0.85rem;
            color: var(--adm-text-muted);
            margin: 0.4rem 0 0.8rem;
            line-height: 1.5;
        }

        .otp-subtext strong {
            color: var(--adm-text);
        }

        .otp-footer-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--adm-border);
            font-size: 0.82rem;
        }

        .btn-link-action {
            background: none;
            border: none;
            color: var(--adm-text-muted);
            cursor: pointer;
            font-size: 0.82rem;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.6rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .btn-link-action:hover:not(:disabled) {
            color: var(--adm-primary);
            background: rgba(16, 185, 129, 0.08);
        }

        .btn-link-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .kpi-card {
            background: var(--adm-card);
            border: 1px solid var(--adm-border);
            border-radius: 12px;
            padding: 1.2rem 1.4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .kpi-val {
            font-size: 1.5rem;
            font-weight: 800;
            font-family: 'Fira Code', monospace;
            color: var(--adm-text);
            margin-top: 0.2rem;
        }

        .kpi-label {
            font-size: 0.78rem;
            color: var(--adm-text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .kpi-icon {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        /* Tabs */
        .adm-tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--adm-border);
            margin-bottom: 1.5rem;
            overflow-x: auto;
        }

        .adm-tab-btn {
            padding: 0.75rem 1.25rem;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--adm-text-muted);
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .adm-tab-btn.active {
            color: var(--adm-primary);
            border-bottom-color: var(--adm-primary);
        }

        /* Tables & Content */
        .adm-section {
            display: none;
        }

        .adm-section.active {
            display: block;
        }

        .table-card {
            background: var(--adm-card);
            border: 1px solid var(--adm-border);
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header-bar {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--adm-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .adm-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.86rem;
            text-align: left;
        }

        .adm-table th {
            background: var(--adm-surface);
            padding: 0.75rem 1rem;
            font-weight: 700;
            color: var(--adm-text-muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--adm-border);
        }

        .adm-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--adm-border);
            vertical-align: middle;
        }

        .adm-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Status Badge */
        .status-select {
            padding: 0.35rem 0.6rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            border: 1px solid var(--adm-border);
            background: var(--adm-surface);
            color: var(--adm-text);
            cursor: pointer;
            outline: none;
        }

        /* Buttons */
        .btn-adm {
            padding: 0.55rem 1rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-adm-primary {
            background: var(--adm-primary);
            color: #ffffff;
        }
        .btn-adm-primary:hover {
            filter: brightness(1.1);
        }

        .btn-adm-secondary {
            background: var(--adm-surface);
            border: 1px solid var(--adm-border);
            color: var(--adm-text);
        }
        .btn-adm-secondary:hover {
            border-color: var(--adm-primary);
        }

        .btn-adm-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        .btn-adm-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* Switch toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569; transition: .3s; border-radius: 22px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--adm-primary); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* Modals */
        .adm-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
            box-sizing: border-box;
        }
        .adm-modal-overlay.active { display: flex; }

        .adm-modal-card {
            background: var(--adm-card);
            border: 1px solid var(--adm-border);
            border-radius: 14px;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.8rem;
            box-sizing: border-box;
        }

        .adm-form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        .adm-form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--adm-text-muted);
            margin-bottom: 0.35rem;
        }
        .adm-form-input, .adm-form-select, .adm-form-textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            background: var(--adm-surface);
            border: 1px solid var(--adm-border);
            color: var(--adm-text);
            font-size: 0.88rem;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
        }
        .adm-form-input:focus, .adm-form-select:focus, .adm-form-textarea:focus {
            border-color: var(--adm-primary);
        }

        @media (max-width: 768px) {
            .adm-table th:nth-child(4), .adm-table td:nth-child(4),
            .adm-table th:nth-child(5), .adm-table td:nth-child(5) {
                display: none;
            }
        }
    
        /* Anti-tamper & Lockout modal */
        .lockout-banner {
            background: rgba(239, 68, 68, 0.15);

<body>

    <!-- ── EN-TÊTE ADMIN ── -->
    <header class="adm-header">
        <a href="boutique.html" class="adm-brand">
            <i class="fa-solid fa-store" style="color: var(--adm-gold);"></i>
            <span>AKOULY <span style="color: var(--adm-primary);">ADMIN</span></span>
            <span class="adm-badge">SÉCURITÉ 3FA</span>
        </a>

        <div class="adm-nav-actions">
            <button type="button" class="btn-adm btn-adm-secondary" id="themeToggleBtn" title="Thème">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button type="button" class="btn-adm btn-adm-danger" id="logoutBtn" style="display: none;" onclick="logoutAdmin()">
                <i class="fa-solid fa-right-from-bracket"></i> <span>Quitter</span>
            </button>
        </div>
    </header>

    <!-- ── ÉCRAN DE VERROUILLAGE / AUTHENTIFICATION (3 ÉTAPES : CLÉ + OTP EMAIL + IDENTIFIANTS) ── -->
    <div id="authScreen" class="auth-overlay">
        <div class="auth-box">
            <!-- ÉTAPE 1 : CLÉ D'ACCÈS -->
            <div id="authStep1" class="auth-step">
                <div class="auth-icon-circle">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 style="font-size: 1.3rem; margin: 0 0 0.4rem;">Espace Gestionnaire</h2>
                <p class="otp-subtext">Étape 1/3 : Entrez votre mot de passe administrateur</p>

                <form id="authFormStep1" onsubmit="handleStep1Password(event)">
                    <input type="password" id="adminSecretInput" placeholder="••••••••" required autocomplete="current-password" autofocus />
                    <button type="submit" id="btnStep1Submit" class="btn-adm btn-adm-primary" style="width: 100%; justify-content: center; padding: 0.85rem;">
                        <i class="fa-solid fa-arrow-right"></i> Continuer vers l'OTP
                    </button>
                </form>
                <div id="authStep1Error" style="color: var(--adm-danger); font-size: 0.82rem; margin-top: 0.8rem; display: none;"></div>
                <div id="lockoutBanner" class="lockout-banner"></div>
            </div>

            <!-- ÉTAPE 2 : CODE OTP VIA EMAILJS -->
            <div id="authStep2" class="auth-step" style="display: none;">
                <div class="auth-icon-circle otp-mode">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 style="font-size: 1.3rem; margin: 0 0 0.4rem;">Vérification OTP (2FA)</h2>
                <p class="otp-subtext">Étape 2/3 : Un code à 6 chiffres a été envoyé à <strong>kouadjoabouajunior@gmail.com</strong></p>

                <form id="authFormStep2" onsubmit="handleStep2Otp(event)">
                    <div class="otp-inputs-grid" id="otpInputsGrid">
                        <input type="text" maxlength="1" class="otp-digit" id="otpDigit1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                        <input type="text" maxlength="1" class="otp-digit" id="otpDigit2" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                        <input type="text" maxlength="1" class="otp-digit" id="otpDigit3" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                        <input type="text" maxlength="1" class="otp-digit" id="otpDigit4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                        <input type="text" maxlength="1" class="otp-digit" id="otpDigit5" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                        <input type="text" maxlength="1" class="otp-digit" id="otpDigit6" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                    </div>

                    <button type="submit" id="btnStep2Submit" class="btn-adm btn-adm-primary" style="width: 100%; justify-content: center; padding: 0.85rem;">
                        <i class="fa-solid fa-arrow-right"></i> Valider et Passer à l'Étape 3
                    </button>
                </form>

                <div id="authStep2Msg" style="font-size: 0.82rem; margin-top: 0.8rem; display: none;"></div>

                <div class="otp-footer-actions">
                    <button type="button" class="btn-link-action" onclick="backToStep1()">
                        <i class="fa-solid fa-arrow-left"></i> Retour
                    </button>
                    <button type="button" class="btn-link-action" id="btnResendOtp" onclick="resendOtpCode()" disabled>
                        <i class="fa-solid fa-rotate-right"></i> Renvoyer (<span id="resendCountdown">60</span>s)
                    </button>
                </div>
            </div>

            <!-- ÉTAPE 3 : IDENTIFIANTS GESTIONNAIRE (3FA) -->
            <div id="authStep3" class="auth-step" style="display: none;">
                <div class="auth-icon-circle user-mode">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 style="font-size: 1.3rem; margin: 0 0 0.4rem;">Accès Gestionnaire (3FA)</h2>
                <p class="otp-subtext">Étape 3/3 : Saisissez vos identifiants personnels</p>

                <form id="authFormStep3" onsubmit="handleStep3Credentials(event)">
                    <div style="text-align: left; margin-bottom: 0.3rem;">
                        <label style="font-size: 0.8rem; color: var(--adm-text-muted); font-weight: 600;">Nom d'utilisateur</label>
                    </div>
                    <input type="text" id="adminUsernameInput" placeholder="Nom d'utilisateur" required autocomplete="username" />
                    
                    <div style="text-align: left; margin-bottom: 0.3rem;">
                        <label style="font-size: 0.8rem; color: var(--adm-text-muted); font-weight: 600;">Mot de passe</label>
                    </div>
                    <input type="password" id="adminPasswordInput" placeholder="••••••••" required autocomplete="current-password" />

                    <button type="submit" id="btnStep3Submit" class="btn-adm btn-adm-primary" style="width: 100%; justify-content: center; padding: 0.85rem; margin-top: 0.5rem;">
                        <i class="fa-solid fa-unlock-keyhole"></i> Valider et Déverrouiller le Portail
                    </button>
                </form>

                <div id="authStep3Error" style="color: var(--adm-danger); font-size: 0.82rem; margin-top: 0.8rem; display: none;"></div>

        // ── MOTEUR DE DÉCHIFFREMENT WEB CRYPTO AES-256-GCM EN MÉMOIRE ──
        async function decryptAndMountAdminVault(password) {
            try {
                const binaryStr = atob(SECURE_VAULT_PAYLOAD);
                const len = binaryStr.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }

                const iv = bytes.subarray(0, 12);
                const tag = bytes.subarray(12, 28);
                const data = bytes.subarray(28);

                const enc = new TextEncoder();
                const keyHash = await crypto.subtle.digest('SHA-256', enc.encode(password));
                const cryptoKey = await crypto.subtle.importKey('raw', keyHash, { name: 'AES-GCM' }, false, ['decrypt']);

                const cipherAndTag = new Uint8Array(data.length + tag.length);
                cipherAndTag.set(data);
                cipherAndTag.set(tag, data.length);

                const decryptedBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, cryptoKey, cipherAndTag);
                const code = new TextDecoder().decode(decryptedBuffer);

                // Définition des variables de session en mémoire
                window.__ADMIN_KEY__ = password;
                window.__APPS_SCRIPT_URL__ = APPS_SCRIPT_URL;

                // Exécution et montage dynamique du Dashboard en mémoire
                const runtime = new Function(code);
                runtime();

                // Masquage de l'écran d'authentification
                document.getElementById('authScreen').style.display = 'none';
                return true;
            } catch (err) {
                console.error("Erreur déchiffrement / montage vault:", err);
                return false;
            }
        }

        // Configuration des champs OTP (saisie fluide, backspace, support Ctrl+V)
        function setupOtpInputs() {
            const digits = [
                document.getElementById('otpDigit1'),
                document.getElementById('otpDigit2'),
                document.getElementById('otpDigit3'),
                document.getElementById('otpDigit4'),
                document.getElementById('otpDigit5'),
                document.getElementById('otpDigit6')
            ];

            digits.forEach((input, index) => {
                if (!input) return;

                input.addEventListener('input', (e) => {
                    const val = e.target.value.replace(/[^0-9]/g, '');
                    e.target.value = val ? val.slice(-1) : '';
                    if (val && index < 5) {
                        digits[index + 1].focus();
                        digits[index + 1].select();
                    }
                    checkAndAutoSubmitOtp();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        digits[index - 1].focus();
                        digits[index - 1].select();
                    } else if (e.key === 'ArrowLeft' && index > 0) {
                        digits[index - 1].focus();
                    } else if (e.key === 'ArrowRight' && index < 5) {
                        digits[index + 1].focus();
                    }
                });

                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                    if (pasted.length >= 6) {
                        for (let i = 0; i < 6; i++) {
                            if (digits[i]) digits[i].value = pasted[i] || '';
                        }
                        digits[5].focus();
                        checkAndAutoSubmitOtp();
                    } else if (pasted.length > 0) {
                        for (let i = 0; i < pasted.length && (index + i) < 6; i++) {
                            if (digits[index + i]) digits[index + i].value = pasted[i];
                        }
                        const nextIdx = Math.min(5, index + pasted.length);
                        if (digits[nextIdx]) digits[nextIdx].focus();
                    }
                });
            });
        }

        function getEnteredOtp() {
            let str = '';
            for (let i = 1; i <= 6; i++) {
                const el = document.getElementById('otpDigit' + i);
                if (el) str += el.value.trim();
            }
            return str;
        }

        function clearOtpInputs() {
            for (let i = 1; i <= 6; i++) {

        // ── PROTECTION RATE LIMITER / ANTI-BRUTE FORCE ──
        function checkDeviceLockout() {
            try {
                const raw = localStorage.getItem('AKOULY_ADM_LOCK');
                if (!raw) return { isLocked: false };
                const data = JSON.parse(raw);
                if (Date.now() < data.lockedUntil) {
                    const remMin = Math.ceil((data.lockedUntil - Date.now()) / 60000);
                    return { isLocked: true, minutes: remMin };
                }
                localStorage.removeItem('AKOULY_ADM_LOCK');
            } catch(e) {}
            return { isLocked: false };
        }

        function recordAuthFailure() {
            try {
                let attempts = Number(sessionStorage.getItem('AKOULY_FAIL_COUNT') || 0) + 1;
                sessionStorage.setItem('AKOULY_FAIL_COUNT', attempts);
                if (attempts >= 5) {
                    const lockedUntil = Date.now() + 10 * 60 * 1000;
                    localStorage.setItem('AKOULY_ADM_LOCK', JSON.stringify({ lockedUntil }));
                    return true;
                }
            } catch(e) {}
            return false;
        }

                sessionStorage.setItem('AKOULY_PENDING_OTP', generatedOtp);
                sessionStorage.setItem('AKOULY_OTP_EXPIRES', otpExpiresAt);

                await sendOtpEmail(generatedOtp);

                document.getElementById('authStep1').style.display = 'none';
                document.getElementById('authStep2').style.display = 'block';
                clearOtpInputs();
                startResendCountdown(60);
            } catch (err) {
                const isLockedNow = recordAuthFailure();
                if (isLockedNow) {
                    errorMsg.innerText = "Trop de tentatives infructueuses. Périphérique verrouillé 10 minutes.";
                } else {
                    errorMsg.innerText = "Clé d'administration invalide.";
                }
                errorMsg.style.display = 'block';
            } finally {
                input.disabled = false;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right"></i> Continuer vers l\'OTP';
            }
        }

        // ── ENVOI DU CODE OTP (EMAILJS + RELAIS APPS SCRIPT) ──
        async function sendOtpEmail(otpCode) {
            const statusMsg = document.getElementById('authStep2Msg');
            if (statusMsg) {
                statusMsg.style.display = 'block';
                statusMsg.style.color = 'var(--adm-primary)';
                statusMsg.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Envoi du code de sécurité en cours...';
            }

            if (typeof emailjs !== 'undefined' && EMAILJS_CONFIG.publicKey) {
                try {
                    const templateParams = {
                        to_email: EMAILJS_CONFIG.adminEmail,
                        email: EMAILJS_CONFIG.adminEmail,
                        user_email: EMAILJS_CONFIG.adminEmail,
                        recipient: EMAILJS_CONFIG.adminEmail,
                        to_name: "Administrateur Akouly",
                        user_name: "Administrateur",
                        otp_code: otpCode,
                        code: otpCode,
                        passcode: otpCode,
                        otp: otpCode,
                        message: `Votre code d'authentification OTP Akouly est : ${otpCode}`
                    };
                    const res = await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, templateParams, EMAILJS_CONFIG.publicKey);
                    console.log("✅ OTP envoyé via EmailJS:", res);
                } catch(e) {
                    console.warn("⚠️ Échec envoi EmailJS:", e);
                }
            }

            // Relais Google Apps Script (GET + POST)
            try {
                const getUrl = `${APPS_SCRIPT_URL}?action=envoyerOtpAdmin&key=${encodeURIComponent(tempAdminKey)}&otp=${otpCode}`;
                fetch(getUrl, { mode: 'no-cors' });

                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        adminKey: tempAdminKey,
                        action: "envoyerOtpAdmin",
                        otpCode: otpCode
                    })
                });
                console.log("✅ Requête OTP relayée à Google Apps Script");
            } catch(e) {
                console.warn("Erreur relais Apps Script:", e);
            }

            if (statusMsg) {
                statusMsg.innerHTML = '<i class="fa-solid fa-circle-check"></i> Code envoyé à <strong>kouadjoabouajunior@gmail.com</strong>';
            }
        }

        // ── ÉTAPE 2 : VALIDATION DU CODE OTP ET PASSAGE À L'ÉTAPE 3 ──
        async function handleStep2Otp(e) {
            if (e) e.preventDefault();
            const entered = getEnteredOtp();
            const msgEl = document.getElementById('authStep2Msg');
            const submitBtn = document.getElementById('btnStep2Submit');

            if (entered.length < 6) {
                if (msgEl) {
                    msgEl.style.display = 'block';
                    msgEl.style.color = 'var(--adm-danger)';
                    msgEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Saisissez les 6 chiffres de l\'OTP.';
                }
                return;
            }

            if (Date.now() > otpExpiresAt) {
                if (msgEl) {
                    msgEl.style.display = 'block';
                    msgEl.style.color = 'var(--adm-danger)';
                    msgEl.innerHTML = '<i class="fa-solid fa-clock"></i> Code expiré. Cliquez sur "Renvoyer".';
                }
                return;
            }

            if (entered === generatedOtp) {
                // Succès Étape 2 ! Passage à l'Étape 3
                sessionStorage.removeItem('AKOULY_FAIL_COUNT');
                sessionStorage.setItem('AKOULY_STEP2_CLEARED', 'true');

                document.getElementById('authStep2').style.display = 'none';
                document.getElementById('authStep3').style.display = 'block';
                
                const userInp = document.getElementById('adminUsernameInput');
                if (userInp) {
                    userInp.value = '';
                    userInp.focus();
                }
                const passInp = document.getElementById('adminPasswordInput');
                if (passInp) passInp.value = '';
                const err3 = document.getElementById('authStep3Error');
                if (err3) err3.style.display = 'none';
            } else {
                recordAuthFailure();
                if (msgEl) {
                    msgEl.style.display = 'block';
                    msgEl.style.color = 'var(--adm-danger)';
                    msgEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Code OTP incorrect.';
                }
                clearOtpInputs();
            }
        }

        // ── ÉTAPE 3 : VÉRIFICATION DES IDENTIFIANTS GESTIONNAIRE (3FA) ET DÉCHIFFREMENT DU DASHBOARD ──
        async function handleStep3Credentials(e) {
            e.preventDefault();
            const lockStatus = checkDeviceLockout();
            if (lockStatus.isLocked) {
                const banner = document.getElementById('lockoutBanner');
                if (banner) {
                    banner.innerText = `Périphérique temporairement verrouillé suite à trop d'échecs. Réessayez dans ${lockStatus.minutes} min.`;
                    banner.style.display = 'block';
                }
                return;
            }

            const userInp = document.getElementById('adminUsernameInput');
            const passInp = document.getElementById('adminPasswordInput');
            const errorMsg = document.getElementById('authStep3Error');
            const submitBtn = document.getElementById('btnStep3Submit');

            const u = userInp.value.trim();
            const p = passInp.value.trim();

            if (!u || !p) return;

            errorMsg.style.display = 'none';
            userInp.disabled = true;
            passInp.disabled = true;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validation des accès...';

            try {
                // Hachage SHA-256 Web Crypto
                const combo = u + ":" + p;
                const enc = new TextEncoder();
                const hashBuf = await crypto.subtle.digest('SHA-256', enc.encode(combo));
                const hashArr = Array.from(new Uint8Array(hashBuf));
                const hashHex = hashArr.map(b => b.toString(16).padStart(2, '0')).join('');

                if (hashHex === STEP3_CREDS_HASH) {
                    // Identifiants validés ! Déchiffrement et montage du Dashboard
                    const mounted = await decryptAndMountAdminVault(tempAdminKey);
                    if (mounted) {
                        sessionStorage.setItem('AKOULY_VAULT_SESSION', tempAdminKey);
                        sessionStorage.removeItem('AKOULY_PENDING_KEY');
                        sessionStorage.removeItem('AKOULY_PENDING_OTP');
                        sessionStorage.removeItem('AKOULY_OTP_EXPIRES');
                        sessionStorage.removeItem('AKOULY_STEP2_CLEARED');
                        sessionStorage.removeItem('AKOULY_FAIL_COUNT');
                    } else {
                        errorMsg.innerText = "Erreur lors du déchiffrement du coffre-fort.";
                        errorMsg.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fa-solid fa-unlock-keyhole"></i> Valider et Déverrouiller le Portail';
                    }
                } else {
                    recordAuthFailure();
                    errorMsg.innerText = "Nom d'utilisateur ou mot de passe incorrect.";
                    errorMsg.style.display = 'block';
                    passInp.value = '';
                    passInp.focus();
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-unlock-keyhole"></i> Valider et Déverrouiller le Portail';
                }
            } catch(err) {
                errorMsg.innerText = "Erreur de validation de sécurité.";
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-unlock-keyhole"></i> Valider et Déverrouiller le Portail';
            } finally {
                userInp.disabled = false;
                passInp.disabled = false;
            }
        }

        // ── RENVOI DU CODE OTP ──
        async function resendOtpCode() {
            if (!tempAdminKey) {
                tempAdminKey = sessionStorage.getItem('AKOULY_PENDING_KEY') || '';
            }
            if (!tempAdminKey) {
                backToStep1();
                return;
            }
            generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
            otpExpiresAt = Date.now() + 10 * 60 * 1000;
            sessionStorage.setItem('AKOULY_PENDING_OTP', generatedOtp);
            sessionStorage.setItem('AKOULY_OTP_EXPIRES', otpExpiresAt);
            clearOtpInputs();
            startResendCountdown(60);
            await sendOtpEmail(generatedOtp);
        }

        function startResendCountdown(seconds) {
            const btn = document.getElementById('btnResendOtp');
            const span = document.getElementById('resendCountdown');
            if (!btn || !span) return;

            clearInterval(resendCountdownTimer);
            let left = seconds;
            btn.disabled = true;
            span.innerText = left;

            resendCountdownTimer = setInterval(() => {
                left--;
                if (left > 0) {
                    span.innerText = left;
                } else {
                    clearInterval(resendCountdownTimer);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Renvoyer le code';
                }
            }, 1000);
        }

        function backToStep1() {
            clearInterval(resendCountdownTimer);
            sessionStorage.removeItem('AKOULY_PENDING_KEY');
            sessionStorage.removeItem('AKOULY_PENDING_OTP');
            sessionStorage.removeItem('AKOULY_OTP_EXPIRES');
            sessionStorage.removeItem('AKOULY_STEP2_CLEARED');
            tempAdminKey = "";
            generatedOtp = "";
            document.getElementById('authStep3').style.display = 'none';
            document.getElementById('authStep2').style.display = 'none';
            document.getElementById('authStep1').style.display = 'block';
            const passInput = document.getElementById('adminSecretInput');
            if (passInput) {
                passInput.value = '';
                passInput.focus();
            }
            const err1 = document.getElementById('authStep1Error');
            if (err1) err1.style.display = 'none';
        }

        function backToStep2() {
            document.getElementById('authStep3').style.display = 'none';
            document.getElementById('authStep2').style.display = 'block';
            sessionStorage.removeItem('AKOULY_STEP2_CLEARED');
            clearOtpInputs();
        }

        function logoutAdmin() {
            sessionStorage.clear();
            const container = document.getElementById('secureAdminApp');
            if (container) container.innerHTML = '';
            location.reload();
        }

        // ── INITIALISATION & RECONDUCTION DE SESSION SÉCURISÉE ──
        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            initEmailJS();
            setupOtpInputs();

            // 1. Session déjà déverrouillée
            const savedKey = sessionStorage.getItem('AKOULY_VAULT_SESSION');
            if (savedKey) {
                const ok = await decryptAndMountAdminVault(savedKey);
                if (ok) return;
            }

            // 2. Étape en cours (survie au rechargement / bascule d'app)
            const pendKey = sessionStorage.getItem('AKOULY_PENDING_KEY');
            const pendOtp = sessionStorage.getItem('AKOULY_PENDING_OTP');
            const exp = Number(sessionStorage.getItem('AKOULY_OTP_EXPIRES') || 0);
            const step2Cleared = sessionStorage.getItem('AKOULY_STEP2_CLEARED') === 'true';

            if (pendKey && pendOtp && Date.now() < exp) {
                tempAdminKey = pendKey;
                generatedOtp = pendOtp;
                otpExpiresAt = exp;

                if (step2Cleared) {
                    document.getElementById('authStep1').style.display = 'none';
                    document.getElementById('authStep2').style.display = 'none';
                    document.getElementById('authStep3').style.display = 'block';
                    const userInp = document.getElementById('adminUsernameInput');
                    if (userInp) userInp.focus();
                } else {
                    document.getElementById('authStep1').style.display = 'none';
                    document.getElementById('authStep3').style.display = 'none';
                    document.getElementById('authStep2').style.display = 'block';
                    const remSec = Math.max(1, Math.round((exp - Date.now()) / 1000));
                    startResendCountdown(Math.min(60, remSec));
                    clearOtpInputs();
                }
                return;
            }

            const input = document.getElementById('adminSecretInput');
            if (input) input.focus();
        });
    </script>
