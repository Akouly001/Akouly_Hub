<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akouly Hub — Showcase Gaming Épuré (3 Produits Visibles)</title>

  <!-- Google Fonts : Orbitron & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Swiper.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    :root {
      --bg-dark: #07090e;
      --neon-cyan: #00f0ff;
      --neon-violet: #8b5cf6;
      --neon-pink: #ec4899;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      margin: 0;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.08) 0%, rgba(139, 92, 246, 0.06) 40%, transparent 70%);
      background-attachment: fixed;
    }

    /* Conteneur principal plein écran centré */
    .showcase-section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Swiper Container */
    .swiper-container-gaming {
      width: 100%;
      max-width: 1000px;
      padding: 60px 0;
      overflow: hidden; /* Masque le 4ème élément en dehors des 3 visibles */
      position: relative;
    }

    .swiper {
      width: 100%;
      overflow: visible !important;
    }

    .swiper-wrapper {
      display: flex;
      align-items: center;
    }

    /* SLIDE : 0 texte, 0 bouton, 0 bordure rigide */
    .swiper-slide {
      width: 280px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: transparent;
      border: none;
      box-shadow: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      
      /* État par défaut pour le 4ème élément masqué */
      opacity: 0;
      pointer-events: none;
      transform: scale(0.65);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .swiper-slide:active {
      cursor: grabbing;
    }

    /* SEULS LES 3 ÉLÉMENTS (Précédent, Actif, Suivant) SONT VISIBLES */
    .swiper-slide-active,
    .swiper-slide-prev,
    .swiper-slide-next {
      opacity: 1;
      pointer-events: auto;
    }

    /* CONTENEUR DE L'IMAGE DU PRODUIT (FLOTTANTE ET ÉPURÉE) */
    .product-holder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* IMAGE RÉELLE DU PRODUIT */
    .product-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      pointer-events: none;
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), filter 0.55s ease;
      will-change: transform, filter;
    }

    /* 1. PRODUIT CENTRAL (Actif - Hero Focus) */
    .swiper-slide-active .product-holder {
      transform: scale(1.18);
    }
    .swiper-slide-active .product-img {
      filter: 
        drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8)) 
        drop-shadow(0 0 35px rgba(0, 240, 255, 0.45));
      animation: floatActive 4s ease-in-out infinite alternate;
    }

    /* 2. PRODUITS GAUCHE & DROITE (Effet de zoom léger et symétrique) */
    .swiper-slide-prev .product-holder,
    .swiper-slide-next .product-holder {
      transform: scale(0.92);
      opacity: 0.82;
    }

    .swiper-slide-prev .product-img,
    .swiper-slide-next .product-img {
      filter: 
        drop-shadow(0 12px 25px rgba(0, 0, 0, 0.7)) 
        drop-shadow(0 0 20px rgba(139, 92, 246, 0.3));
    }

    /* Hover interactif sur les côtés gauche et droite */
    .swiper-slide-prev:hover .product-holder,
    .swiper-slide-next:hover .product-holder {
      transform: scale(0.98);
      opacity: 1;
    }

    @keyframes floatActive {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.02); }
    }

    /* Halo lumineux doux sous le produit actif */
    .glow-floor {
      position: absolute;
      width: 220px;
      height: 40px;
      background: radial-gradient(ellipse, rgba(0, 240, 255, 0.4) 0%, rgba(139, 92, 246, 0.15) 50%, transparent 75%);
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      filter: blur(14px);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .swiper-slide-active .glow-floor {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .swiper-slide {
        width: 210px;
        height: 280px;
      }
      .swiper-slide-active .product-holder {
        transform: scale(1.12);
      }
      .swiper-slide-prev .product-holder,
      .swiper-slide-next .product-holder {
        transform: scale(0.85);
      }
    }
  </style>
</head>
<body>

  <section class="showcase-section">
    <div class="swiper-container-gaming">
      <div class="swiper">
        <div class="swiper-wrapper">
          
          <!-- 1. Processeur AMD Ryzen -->
          <div class="swiper-slide">
            <div class="product-holder">
              <img src="images/gaming-cpu-ryzen.png" alt="AMD Ryzen" class="product-img">
              <div class="glow-floor"></div>
            </div>
          </div>

          <!-- 2. Carte Mère MSI Gaming Plus WiFi -->
          <div class="swiper-slide">
            <div class="product-holder">
              <img src="images/gaming-mobo-msi.png" alt="MSI Gaming Plus WiFi" class="product-img">
              <div class="glow-floor"></div>
            </div>
          </div>

          <!-- 3. RAM Corsair Vengeance RGB PRO SL -->
          <div class="swiper-slide">
            <div class="product-holder">
              <img src="images/gaming-ram-corsair.png" alt="Corsair Vengeance RGB PRO" class="product-img">
              <div class="glow-floor"></div>
            </div>
          </div>

          <!-- 4. SSD Kingston KC3000 PCIe 4.0 NVMe -->
          <div class="swiper-slide">
            <div class="product-holder">
              <img src="images/gaming-ssd-kingston.png" alt="Kingston KC3000 SSD" class="product-img">
              <div class="glow-floor"></div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </section>

  <!-- Swiper.js -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const swiper = new Swiper('.swiper', {
        effect: 'coverflow',
        grabCursor: true,
        centeredSlides: true,
        slidesPerView: 3, /* Strictement 3 objets visibles à la fois */
        loop: true,
        slideToClickedSlide: true,
        speed: 650,

        // Transition 3D coverflow fluide sans rupture
        coverflowEffect: {
          rotate: 15,
          stretch: 15,
          depth: 140,
          modifier: 1,
          slideShadows: false, /* 0 ombre dure, pure fluidité lumineuse */
        },

        // Défilement automatique fluide
        autoplay: {
          delay: 3200,
          disableOnInteraction: false,
          pauseOnMouseEnter: true,
        },

        // Support complet molette et tactile
        mousewheel: {
          forceToAxis: true,
          sensitivity: 1,
        },
        keyboard: {
          enabled: true,
        },
      });
    });
  </script>
</body>
</html>
